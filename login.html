<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login/Signup Form</title>
    <link rel="stylesheet" href="login.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>

<body>
    <a href="home.html" class="home-container">
        <!-- <img src="assets/home.png" alt="Home icon" class="home-icon"> -->
        <i class="bx bxs-home bx-sm home-icon"></i>
        <h3>Home</h3>
    </a>
    <div class="container">
        <div class="form-box login">
            <form action="#">
                <h1>Login</h1>
                <div class="input-box">
                    <input type="text" placeholder="Username" required>
                    <i class='bx bxs-user'></i>
                </div>
                <div class="input-box">
                    <input type="password" placeholder="Password" required>
                    <i class='bx bxs-lock-alt'></i>
                </div>
                <div class="forgot-link">
                    <a href="#">Forgot Password?</a>
                </div>
                <button type="submit" class="btn">Login</button>
            </form>
        </div>

        <div class="form-box register">
            <form action="#">
                <h1>Registration</h1>
                <div class="input-box">
                    <input type="text" placeholder="Username" required>
                    <i class='bx bxs-user'></i>
                </div>
                <div class="input-box">
                    <input type="password" placeholder="Password" required>
                    <i class='bx bxs-lock-alt'></i>
                </div>
                <div class="input-box password">
                    <input type="password" placeholder="Confirm Password" required>
                    <i class='bx bxs-lock-alt'></i>
                </div>
                <fieldset class="adminKey-fieldset-component">
                    <legend>Verify Admin Key</legend>
                    <div class="adminKey-input-wrapper">
                        <input type="text" maxlength="1" class="adminKey-digit" inputmode="numeric" />
                        <input type="text" maxlength="1" class="adminKey-digit" inputmode="numeric" />
                        <input type="text" maxlength="1" class="adminKey-digit" inputmode="numeric" />
                        <span class="adminKey-separator"></span>
                        <input type="text" maxlength="1" class="adminKey-digit" inputmode="numeric" />
                        <input type="text" maxlength="1" class="adminKey-digit" inputmode="numeric" />
                        <input type="text" maxlength="1" class="adminKey-digit" inputmode="numeric" />
                    </div>
                </fieldset>

                <button type="submit" class="btn">Register</button>

            </form>
        </div>



        <div class="toggle-box">
            <div class="toggle-panel toggle-left">
                <h1>Hello, Welcome!</h1>
                <p>Don't have an account?</p>
                <button class="btn register-btn">Register</button>
            </div>

            <div class="toggle-panel toggle-right">
                <h1>Welcome Back!</h1>
                <p>Already have an account?</p>
                <button class="btn login-btn">Login</button>
            </div>
        </div>
    </div>

    <script src="login.js"></script>
</body>

</html>
